name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed signing material
        run: |
          if git ls-files | grep -E '(^|/)(keystore\.properties|.*\.jks|.*\.keystore|.*\.p12|.*\.p8|.*\.key)$'; then
            echo "::error::Signing material is tracked in git. Remove it before merging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci --runInBand

      - name: Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/afterlight-export"

      - name: Assert no keystore properties in the bundle
        run: |
          if grep -R "storePassword\|keyPassword" "$RUNNER_TEMP/afterlight-export" >/dev/null 2>&1; then
            echo "::error::Credential-like strings found in the export."
            exit 1
          fi
